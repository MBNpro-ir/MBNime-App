name: Test Android TV 6
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  television:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true
          pub-cache: true
      - name: Prepare TV media and acceleration
        run: |
          sudo chmod a+rw /dev/kvm
          python3 tools/serve_compatibility_media.py integration_test/fixtures > "$RUNNER_TEMP/media-server.log" 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent --head http://127.0.0.1:8765/mbn-compatibility.mp4; then
              exit 0
            fi
            sleep 0.25
          done
          cat "$RUNNER_TEMP/media-server.log"
          exit 1
      - name: Run on Android TV API 23
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          target: android-tv
          arch: x86
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: flutter test integration_test/android_compatibility_test.dart -d emulator-5554 --dart-define=MBN_QA_EXPECT_SDK=23 --dart-define=MBN_QA_EXPECT_TV=true
