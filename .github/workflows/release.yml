name: Build MBNime release
run-name: Release ${{ inputs.release_tag }} from master

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag matching pubspec.yaml and Persian changelog
        required: true
        default: v2.0.45
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.32.8
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  android:
    if: github.ref == 'refs/heads/master'
    name: Build Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out master
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter with master caches
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Verify requested version
        shell: bash
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          test "$RELEASE_TAG" = "v${version}" || {
            echo "release_tag must match pubspec.yaml" >&2
            exit 1
          }
          test -s "changelogs/${version}.fa.md"

      - name: Analyze and test both device layouts
        run: |
          flutter pub get
          flutter analyze lib test integration_test packages/flutter_secure_storage_windows/lib
          flutter test
          node tools/test_web_access.cjs

      - name: Restore dedicated Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mbnime-release.jks"
          chmod 600 "$RUNNER_TEMP/mbnime-release.jks"

      - name: Build split Android APKs
        env:
          MBN_API_KEY: ${{ secrets.MBN_API_KEY }}
          MBN_KEYSTORE_PATH: ${{ runner.temp }}/mbnime-release.jks
          MBN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MBN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MBN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$MBN_API_KEY"
          flutter build apk --release --target-platform android-arm,android-arm64 --split-per-abi \
            --dart-define="MBN_API_KEY=$MBN_API_KEY"

      - name: Verify packaged Android 6 and TV support
        run: |
          python3 tools/verify_android_apk.py \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Prepare Android release files
        shell: bash
        run: |
          version="$RELEASE_TAG"
          version="${version#v}"
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "release-assets/MBNime-Android-arm64-v8a-${version}.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "release-assets/MBNime-Android-armeabi-v7a-${version}.apk"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: release-assets/*.apk
          if-no-files-found: error
          compression-level: 0

  windows:
    if: github.ref == 'refs/heads/master'
    name: Build Windows x64
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Check out master
        uses: actions/checkout@v6

      - name: Set up Flutter with master caches
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Test Windows encrypted storage
        run: |
          flutter pub get
          flutter test packages/flutter_secure_storage_windows/test/unit_test.dart

      - name: Build Windows release
        env:
          MBN_API_KEY: ${{ secrets.MBN_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MBN_API_KEY)) { throw 'MBN_API_KEY secret is missing' }
          flutter build windows --release --dart-define="MBN_API_KEY=$env:MBN_API_KEY"

      - name: Package Windows application
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $source = 'build\windows\x64\runner\Release'
          if (-not (Test-Path -LiteralPath "$source\updater.exe")) { throw 'updater.exe was not bundled' }
          $legacyExecutable = Join-Path $source 'animeon.exe'
          if (Test-Path -LiteralPath $legacyExecutable) {
            Remove-Item -LiteralPath $legacyExecutable -Force
          }
          New-Item -ItemType Directory -Path release-assets, staging\MBNime -Force | Out-Null
          Copy-Item -Path "$source\*" -Destination staging\MBNime -Recurse -Force
          Compress-Archive -LiteralPath staging\MBNime `
            -DestinationPath "release-assets\MBNime-Windows-x64-$version.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: release-assets/*.zip
          if-no-files-found: error
          compression-level: 0

  android-compatibility:
    if: github.ref == 'refs/heads/master'
    name: Test Android 6 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true
      - name: Prepare emulator acceleration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          sudo chmod a+rw /dev/kvm
          mkdir -p "$RUNNER_TEMP/mbn-media"
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=24 \
            -f lavfi -i sine=frequency=440:sample_rate=44100 -t 30 -c:v libx264 \
            -profile:v baseline -pix_fmt yuv420p -c:a aac -b:a 64k -movflags +faststart \
            "$RUNNER_TEMP/mbn-media/mbn-compatibility.mp4"
          python3 tools/serve_compatibility_media.py "$RUNNER_TEMP/mbn-media" > "$RUNNER_TEMP/media-server.log" 2>&1 &
      - name: Test native encryption, files and playback on API 23
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: flutter test integration_test/android_compatibility_test.dart -d emulator-5554 --dart-define=MBN_QA_EXPECT_SDK=23

  release:
    name: Publish GitHub release
    needs: [android, windows, android-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v6
      - name: Download release files
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --draft \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "⭐ MBNime ${RELEASE_TAG#v}" \
            --notes-file "changelogs/${RELEASE_TAG#v}.fa.md"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
