flt-semantics[role="button"]{overflow:hidden!important}

#web-access{font:16px/1.9 Tahoma,Arial,sans-serif;box-sizing:border-box;max-width:660px;margin:0 auto;padding:40px 24px calc(40px + env(safe-area-inset-bottom));color:#f7f7fb;text-align:right}

</style>
